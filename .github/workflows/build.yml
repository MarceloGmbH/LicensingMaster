name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the multi-stage image
        run: docker build -f licensing-master/Dockerfile -t licensing-master:ci .

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sistema_farmacia_licensing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: licensing-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Migrate + smoke
        env:
          LM_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sistema_farmacia_licensing
          APP_ENV: test
        run: |
          alembic upgrade head
          pytest tests -q
