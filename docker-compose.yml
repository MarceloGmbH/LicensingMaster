# Central multi-product licensing control plane (ADR-0013): its own Postgres,
# the licensing-master API (portal bundled at "/"), and a dormant Cloudflare
# Tunnel connector.
#
#   cp .env.example .env        # fill in real secrets
#   docker compose up -d --build
#
# Migrations run automatically on container start (entrypoint.sh -> alembic
# upgrade head). Ingress is handled by the shared Traefik on vm-gateway, which
# routes licensing.alanadev.com + licensing-cp.alanadev.com to this container's
# published port (see deploy.md). The `cloudflared` service is kept defined but
# OFF (profile `tunnel`) for a possible future switch to a real tunnel.

name: licensing

services:
  licensing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: ${LM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LM_POSTGRES_PASSWORD:?set LM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LM_POSTGRES_DB:-sistema_farmacia_licensing}
    volumes:
      - lm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LM_POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lm]

  licensing-master:
    build:
      context: .
      dockerfile: licensing-master/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      # `production` enforces Cloudflare Access on /admin/* and /. Set
      # LM_APP_ENV=development for a pre-Access smoke where the X-Dev-Admin-Email
      # header fallback is accepted instead.
      APP_ENV: ${LM_APP_ENV:-production}
      APP_DEBUG: "false"
      LM_DATABASE_URL: postgresql+psycopg://${LM_POSTGRES_USER:-postgres}:${LM_POSTGRES_PASSWORD}@licensing-db:5432/${LM_POSTGRES_DB:-sistema_farmacia_licensing}
      # Ed25519 private key (base64, 32 raw bytes). Empty -> deterministic dev
      # signer; set a real key before shipping device_config.dat to clients.
      LM_ED25519_PRIVATE_KEY_B64: ${LM_ED25519_PRIVATE_KEY_B64:-}
      # Cloudflare Access — verifies the JWT injected on /admin/* and /.
      # Required in production; may be empty for an LM_APP_ENV=development smoke.
      LM_ACCESS_TEAM_DOMAIN: ${LM_ACCESS_TEAM_DOMAIN:-}
      LM_ACCESS_AUD: ${LM_ACCESS_AUD:-}
      LM_ADMIN_EMAILS: ${LM_ADMIN_EMAILS:?set LM_ADMIN_EMAILS}
      LM_DEFAULT_WINDOW_DAYS: ${LM_DEFAULT_WINDOW_DAYS:-30}
      LM_DEFAULT_GRACE_DAYS: ${LM_DEFAULT_GRACE_DAYS:-5}
      LM_DEFAULT_SEAT_LIMIT: ${LM_DEFAULT_SEAT_LIMIT:-5}
      CORS_ORIGINS: ${LM_CORS_ORIGINS:-["*"]}
    # Published for the shared Traefik reverse proxy on vm-gateway. On vm-services
    # the .env sets LM_BIND_ADDR=0.0.0.0 and LM_HOST_PORT=3013 — Traefik's
    # licensing.yml router points at 10.10.4.10:3013. Safe local default: 127.0.0.1.
    ports:
      - "${LM_BIND_ADDR:-127.0.0.1}:${LM_HOST_PORT:-8010}:8000"
    depends_on:
      licensing-db:
        condition: service_healthy
    networks: [lm]

  cloudflared:
    # OFF by default. Only starts with `--profile tunnel`. Ingress is Traefik
    # today; this is here so a future switch to a real tunnel is one env var away.
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN from the Cloudflare dashboard}
    depends_on:
      - licensing-master
    networks: [lm]

volumes:
  # The one stateful volume. Declared external so the compose refuses to start
  # against a missing volume instead of silently creating an empty one — the
  # separation cut re-attaches the existing `licensing_lm_pgdata` by name.
  lm_pgdata:
    external: true
    name: licensing_lm_pgdata

networks:
  lm:
    driver: bridge
