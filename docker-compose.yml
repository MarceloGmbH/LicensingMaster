# Central licensing control plane (ADR-0013): its own Postgres, the
# licensing-master API (with the portal bundled and served at "/"), and a
# dormant Cloudflare Tunnel connector (profile `tunnel`). The portal/admin host
# MUST be restricted to LAN/VPN at the reverse proxy (Traefik ipAllowList); the
# native login (password + TOTP) is the second barrier. See deploy.md.
#
#   cp .env.licensing.example .env.licensing     # fill in real secrets
#   docker compose --env-file .env.licensing -f docker-compose.yml up -d --build
#
# Migrations run automatically on container start (entrypoint.sh -> alembic
# upgrade head). First admin + network setup: deploy.md

name: licensing

services:
  licensing-db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: ${LM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LM_POSTGRES_PASSWORD:?set LM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LM_POSTGRES_DB:-sistema_farmacia_licensing}
    volumes:
      - lm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LM_POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lm]

  licensing-master:
    build:
      context: .
      dockerfile: licensing-master/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      # `production` makes the session cookie Secure (HTTPS only) and requires the
      # signing key. Use development only for a local, non-HTTPS smoke.
      APP_ENV: ${LM_APP_ENV:-production}
      APP_DEBUG: "false"
      LM_DATABASE_URL: postgresql+psycopg://${LM_POSTGRES_USER:-postgres}:${LM_POSTGRES_PASSWORD}@licensing-db:5432/${LM_POSTGRES_DB:-sistema_farmacia_licensing}
      # Ed25519 private key (base64, 32 raw bytes). REQUIRED unless
      # LM_APP_ENV=development: the service refuses to start without it.
      LM_ED25519_PRIVATE_KEY_B64: ${LM_ED25519_PRIVATE_KEY_B64:-}
      # Brute-force throttling + trusted proxy hops (see .env.example).
      LM_ACTIVATE_MAX_FAILURES: ${LM_ACTIVATE_MAX_FAILURES:-10}
      LM_ACTIVATE_FAILURE_WINDOW_SECONDS: ${LM_ACTIVATE_FAILURE_WINDOW_SECONDS:-600}
      LM_ACTIVATE_LOCKOUT_SECONDS: ${LM_ACTIVATE_LOCKOUT_SECONDS:-900}
      LM_CP_AUTH_MAX_FAILURES: ${LM_CP_AUTH_MAX_FAILURES:-20}
      LM_CP_AUTH_FAILURE_WINDOW_SECONDS: ${LM_CP_AUTH_FAILURE_WINDOW_SECONDS:-600}
      LM_CP_AUTH_LOCKOUT_SECONDS: ${LM_CP_AUTH_LOCKOUT_SECONDS:-900}
      LM_FORWARDED_ALLOW_IPS: ${LM_FORWARDED_ALLOW_IPS:-*}
      # Native admin login: session lifetimes and brute-force throttling.
      LM_ADMIN_SESSION_IDLE_SECONDS: ${LM_ADMIN_SESSION_IDLE_SECONDS:-1800}
      LM_ADMIN_SESSION_ABSOLUTE_SECONDS: ${LM_ADMIN_SESSION_ABSOLUTE_SECONDS:-28800}
      LM_ADMIN_LOGIN_EMAIL_MAX_FAILURES: ${LM_ADMIN_LOGIN_EMAIL_MAX_FAILURES:-5}
      LM_ADMIN_LOGIN_EMAIL_WINDOW_SECONDS: ${LM_ADMIN_LOGIN_EMAIL_WINDOW_SECONDS:-900}
      LM_ADMIN_LOGIN_EMAIL_LOCKOUT_SECONDS: ${LM_ADMIN_LOGIN_EMAIL_LOCKOUT_SECONDS:-900}
      LM_ADMIN_LOGIN_IP_MAX_FAILURES: ${LM_ADMIN_LOGIN_IP_MAX_FAILURES:-10}
      LM_ADMIN_LOGIN_IP_WINDOW_SECONDS: ${LM_ADMIN_LOGIN_IP_WINDOW_SECONDS:-900}
      LM_ADMIN_LOGIN_IP_LOCKOUT_SECONDS: ${LM_ADMIN_LOGIN_IP_LOCKOUT_SECONDS:-900}
      LM_DEFAULT_WINDOW_DAYS: ${LM_DEFAULT_WINDOW_DAYS:-30}
      LM_DEFAULT_GRACE_DAYS: ${LM_DEFAULT_GRACE_DAYS:-5}
      LM_DEFAULT_SEAT_LIMIT: ${LM_DEFAULT_SEAT_LIMIT:-5}
      CORS_ORIGINS: ${LM_CORS_ORIGINS:-["*"]}
    # Published for curl verification and for an external reverse proxy (e.g. a
    # shared Traefik) when you route ingress that way instead of the bundled
    # cloudflared. Safe default: localhost only. Set LM_BIND_ADDR=0.0.0.0 and an
    # LM_HOST_PORT to expose it on the host's LAN interface.
    ports:
      - "${LM_BIND_ADDR:-127.0.0.1}:${LM_HOST_PORT:-8010}:8000"
    depends_on:
      licensing-db:
        condition: service_healthy
    networks: [lm]

  cloudflared:
    # Only starts with `--profile tunnel`. Skip it when ingress is handled by an
    # external/shared reverse proxy (see the ports: note on licensing-master).
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN from the Cloudflare dashboard}
    depends_on:
      - licensing-master
    networks: [lm]

volumes:
  lm_pgdata:

networks:
  lm:
    driver: bridge
